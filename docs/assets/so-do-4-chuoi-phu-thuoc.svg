<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- nhãn tầng bên trái -->
  <text x="28" y="78"  font-size="15" fill="#94a3b8" font-weight="600">PRESENTATION</text>
  <text x="28" y="222" font-size="15" fill="#94a3b8" font-weight="600">DOMAIN</text>
  <text x="28" y="366" font-size="15" fill="#94a3b8" font-weight="600">DATA</text>
  <line x1="24" y1="92"  x2="24" y2="170" stroke="#e2e8f0" stroke-width="3"/>
  <line x1="24" y1="236" x2="24" y2="300" stroke="#e2e8f0" stroke-width="3"/>
  <line x1="24" y1="380" x2="24" y2="580" stroke="#e2e8f0" stroke-width="3"/>

  <!-- hàng 1 -->
  <rect x="230" y="44" width="180" height="62" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="320" y="82" text-anchor="middle" font-size="19" fill="#0f172a">HomePage</text>

  <rect x="470" y="44" width="210" height="62" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="575" y="82" text-anchor="middle" font-size="19" fill="#0f172a">PostProvider</text>

  <line x1="410" y1="75" x2="462" y2="75" stroke="#64748b" stroke-width="2.5" marker-end="url(#dn)"/>

  <!-- hợp đồng 1 -->
  <line x1="575" y1="106" x2="575" y2="150" stroke="#64748b" stroke-width="2.5" marker-end="url(#dn)"/>

  <rect x="430" y="154" width="290" height="66" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="575" y="184" text-anchor="middle" font-size="19" fill="#0f172a">IPostRepository</text>
  <text x="575" y="207" text-anchor="middle" font-size="13" fill="#dc2626">hợp đồng</text>

  <!-- impl cắm ngược lên -->
  <line x1="575" y1="290" x2="575" y2="228" stroke="#dc2626" stroke-width="3.5" marker-end="url(#up)"/>
  <text x="600" y="264" font-size="15" fill="#dc2626" font-weight="700">implements</text>

  <rect x="420" y="294" width="310" height="66" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="575" y="334" text-anchor="middle" font-size="19" fill="#0f172a">PostRepositoryImpl</text>

  <!-- hợp đồng 2 -->
  <line x1="575" y1="360" x2="575" y2="404" stroke="#64748b" stroke-width="2.5" marker-end="url(#dn)"/>

  <rect x="430" y="408" width="290" height="66" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="575" y="438" text-anchor="middle" font-size="19" fill="#0f172a">IPostDataSource</text>
  <text x="575" y="461" text-anchor="middle" font-size="13" fill="#dc2626">hợp đồng</text>

  <line x1="575" y1="540" x2="575" y2="482" stroke="#dc2626" stroke-width="3.5" marker-end="url(#up)"/>
  <text x="600" y="516" font-size="15" fill="#dc2626" font-weight="700">implements</text>

  <rect x="420" y="544" width="310" height="60" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="575" y="581" text-anchor="middle" font-size="19" fill="#0f172a">PostDataSourceImpl</text>

  <!-- nhánh xuống SQLite -->
  <line x1="730" y1="574" x2="786" y2="574" stroke="#64748b" stroke-width="2.5" marker-end="url(#dn)"/>
  <rect x="790" y="544" width="180" height="60" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="880" y="581" text-anchor="middle" font-size="19" fill="#0f172a">SQLite</text>

  <!-- chú giải -->
  <rect x="762" y="150" width="220" height="120" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="782" y="180" font-size="15" fill="#92400e" font-weight="700">Hai mũi tên đỏ</text>
  <text x="782" y="206" font-size="14" fill="#92400e">đi NGƯỢC LÊN.</text>
  <text x="782" y="234" font-size="14" fill="#92400e">Đó là</text>
  <text x="782" y="256" font-size="15" fill="#92400e" font-weight="700">Dependency Inversion</text>
</svg>
