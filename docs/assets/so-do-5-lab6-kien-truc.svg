  <text x="185" y="202" text-anchor="middle" font-size="18" fill="#475569">ContactProvider</text>

  <line x1="310" y1="194" x2="358" y2="194" stroke="#64748b" stroke-width="2.5" marker-end="url(#d5)"/>

  <rect x="362" y="166" width="268" height="56" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
