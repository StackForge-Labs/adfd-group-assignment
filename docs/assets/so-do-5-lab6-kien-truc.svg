  <text x="496" y="324" text-anchor="middle" font-size="18" fill="#0f172a">ContactRepositoryImpl</text>

  <line x1="496" y1="344" x2="496" y2="374" stroke="#64748b" stroke-width="2.5" marker-end="url(#d5)"/>

