  <text x="496" y="414" text-anchor="middle" font-size="18" fill="#0f172a">IContactDataSource</text>

  <!-- tầng đáy KHÁC Lab 5 -->
  <line x1="630" y1="406" x2="686" y2="406" stroke="#64748b" stroke-width="2.5" marker-end="url(#d5)"/>

