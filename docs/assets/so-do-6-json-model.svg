<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="bk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- chiều nhận: server → UI -->
  <text x="30" y="44" font-size="16" fill="#2563eb" font-weight="700">NHẬN DỮ LIỆU — server về app</text>

  <rect x="30"  y="60" width="150" height="64" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="99" text-anchor="middle" font-size="17" fill="#0f172a">Server</text>

  <rect x="228" y="60" width="180" height="64" rx="9" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="318" y="92" text-anchor="middle" font-size="16" fill="#0f172a">chuỗi JSON</text>
  <text x="318" y="112" text-anchor="middle" font-size="13" fill="#64748b">text thô</text>

  <rect x="456" y="60" width="130" height="64" rx="9" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="521" y="99" text-anchor="middle" font-size="17" fill="#0f172a">Map</text>

  <rect x="634" y="60" width="200" height="64" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="734" y="99" text-anchor="middle" font-size="17" fill="#0f172a">ContactModel</text>

  <rect x="882" y="60" width="90" height="64" rx="9" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="927" y="99" text-anchor="middle" font-size="17" fill="#0f172a">UI</text>

  <line x1="180" y1="92" x2="220" y2="92" stroke="#2563eb" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="408" y1="92" x2="448" y2="92" stroke="#2563eb" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="586" y1="92" x2="626" y2="92" stroke="#2563eb" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="834" y1="92" x2="874" y2="92" stroke="#2563eb" stroke-width="2.5" marker-end="url(#f)"/>

  <text x="560" y="152" font-size="15" fill="#ea580c" font-weight="600">ContactModel.fromJson()</text>
  <line x1="660" y1="140" x2="700" y2="130" stroke="#ea580c" stroke-width="2"/>

  <!-- chiều gửi -->
  <line x1="30" y1="196" x2="970" y2="196" stroke="#e2e8f0" stroke-width="2"/>

  <text x="30" y="236" font-size="16" fill="#ea580c" font-weight="700">GỬI DỮ LIỆU — app lên server</text>

  <rect x="30"  y="252" width="200" height="64" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="130" y="291" text-anchor="middle" font-size="17" fill="#0f172a">ContactModel</text>

  <rect x="278" y="252" width="180" height="64" rx="9" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="368" y="291" text-anchor="middle" font-size="17" fill="#0f172a">chuỗi JSON</text>

  <rect x="506" y="252" width="150" height="64" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="581" y="291" text-anchor="middle" font-size="17" fill="#0f172a">Server</text>

  <line x1="230" y1="284" x2="270" y2="284" stroke="#ea580c" stroke-width="2.5" marker-end="url(#bk)"/>
  <line x1="458" y1="284" x2="498" y2="284" stroke="#ea580c" stroke-width="2.5" marker-end="url(#bk)"/>

  <text x="252" y="342" font-size="15" fill="#ea580c" font-weight="600">toJson()</text>

  <!-- ghi chú 10.0.2.2 -->
  <rect x="700" y="248" width="272" height="96" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="720" y="278" font-size="15" fill="#92400e" font-weight="700">10.0.2.2</text>
  <text x="720" y="302" font-size="14" fill="#92400e">Địa chỉ đặc biệt để Android</text>
  <text x="720" y="324" font-size="14" fill="#92400e">emulator trỏ về máy tính.</text>
</svg>
