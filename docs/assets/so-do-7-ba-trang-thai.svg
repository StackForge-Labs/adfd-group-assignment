<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- gọi API -->
  <rect x="390" y="26" width="220" height="58" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="500" y="62" text-anchor="middle" font-size="19" fill="#0f172a">gọi API</text>

  <line x1="500" y1="84" x2="500" y2="112" stroke="#64748b" stroke-width="2.5"/>
  <line x1="170" y1="112" x2="830" y2="112" stroke="#64748b" stroke-width="2.5"/>
  <line x1="170" y1="112" x2="170" y2="146" stroke="#64748b" stroke-width="2.5" marker-end="url(#s)"/>
  <line x1="500" y1="112" x2="500" y2="146" stroke="#64748b" stroke-width="2.5" marker-end="url(#s)"/>
  <line x1="830" y1="112" x2="830" y2="146" stroke="#64748b" stroke-width="2.5" marker-end="url(#s)"/>

  <!-- 3 nhánh -->
  <rect x="52"  y="150" width="236" height="62" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="170" y="188" text-anchor="middle" font-size="18" fill="#0f172a">thành công</text>

  <rect x="382" y="150" width="236" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="500" y="188" text-anchor="middle" font-size="18" fill="#0f172a">lỗi HTTP</text>

  <rect x="712" y="150" width="236" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="830" y="188" text-anchor="middle" font-size="18" fill="#0f172a">mất mạng</text>

  <!-- state -->
  <line x1="170" y1="212" x2="170" y2="246" stroke="#64748b" stroke-width="2.5" marker-end="url(#s)"/>
  <line x1="500" y1="212" x2="500" y2="246" stroke="#64748b" stroke-width="2.5" marker-end="url(#s)"/>
  <line x1="830" y1="212" x2="830" y2="246" stroke="#64748b" stroke-width="2.5" marker-end="url(#s)"/>

  <text x="170" y="276" text-anchor="middle" font-size="20" fill="#16a34a" font-family="ui-monospace, Menlo, monospace">contacts</text>
  <text x="500" y="276" text-anchor="middle" font-size="20" fill="#dc2626" font-family="ui-monospace, Menlo, monospace">error</text>
  <text x="830" y="276" text-anchor="middle" font-size="20" fill="#dc2626" font-family="ui-monospace, Menlo, monospace">error</text>

  <!-- gộp về finally -->
  <line x1="170" y1="292" x2="170" y2="322" stroke="#64748b" stroke-width="2.5"/>
  <line x1="500" y1="292" x2="500" y2="322" stroke="#64748b" stroke-width="2.5"/>
  <line x1="830" y1="292" x2="830" y2="322" stroke="#64748b" stroke-width="2.5"/>
  <line x1="170" y1="322" x2="830" y2="322" stroke="#64748b" stroke-width="2.5"/>
  <line x1="500" y1="322" x2="500" y2="352" stroke="#16a34a" stroke-width="3.5" marker-end="url(#sg)"/>

  <rect x="330" y="356" width="340" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="500" y="384" text-anchor="middle" font-size="19" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">finally</text>
  <text x="500" y="408" text-anchor="middle" font-size="16" fill="#16a34a" font-weight="600">loading = false</text>

  <text x="690" y="392" font-size="16" fill="#16a34a" font-weight="700">← luôn chạy</text>
  <text x="690" y="414" font-size="14" fill="#64748b">không đường nào thoát</text>

  <!-- so sánh bản gốc -->
  <text x="30" y="452" font-size="15" fill="#0f172a" font-weight="700">Bản gốc chỉ có hai trạng thái: đang tải và có dữ liệu.</text>
  <text x="30" y="474" font-size="15" fill="#64748b">Thiếu trạng thái hỏng → backend chết thì spinner quay vĩnh viễn.</text>
</svg>
