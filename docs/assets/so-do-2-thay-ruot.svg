<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- nhãn nằm TRÊN khung, không còn tràn mép -->
  <text x="30" y="40" font-size="17" fill="#94a3b8" font-weight="700">KHÔNG ĐỔI — tầng trên giữ nguyên</text>

  <rect x="20" y="56" width="920" height="120" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 5"/>

  <rect x="60"  y="86" width="220" height="62" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="170" y="124" text-anchor="middle" font-size="18" fill="#94a3b8">HomePage</text>

  <rect x="340" y="86" width="230" height="62" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="455" y="124" text-anchor="middle" font-size="18" fill="#94a3b8">PostProvider</text>

  <rect x="630" y="86" width="270" height="62" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="765" y="124" text-anchor="middle" font-size="18" fill="#94a3b8">IPostRepository</text>

  <line x1="280" y1="117" x2="332" y2="117" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="570" y1="117" x2="622" y2="117" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- phần thay mới -->
  <line x1="765" y1="234" x2="765" y2="184" stroke="#dc2626" stroke-width="3.5" marker-end="url(#r)"/>

  <rect x="620" y="238" width="290" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="765" y="280" text-anchor="middle" font-size="19" fill="#0f172a">PostRepositoryImpl</text>

  <line x1="765" y1="308" x2="765" y2="342" stroke="#64748b" stroke-width="2.5" marker-end="url(#n)"/>

  <rect x="660" y="346" width="210" height="56" rx="9" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="765" y="381" text-anchor="middle" font-size="19" fill="#0f172a">SQLite</text>

  <!-- chú thích bên trái -->
  <text x="60" y="256" font-size="19" fill="#dc2626" font-weight="700">Chỉ phần này thay mới</text>
  <text x="60" y="292" font-size="16" fill="#475569">Dữ liệu giả → SQLite thật</text>
  <text x="60" y="322" font-size="16" fill="#475569">Tầng trên không phải sửa</text>
  <text x="60" y="348" font-size="16" fill="#475569">một dòng nào.</text>
</svg>
