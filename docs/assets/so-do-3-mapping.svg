<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 4 chặng -->
  <rect x="30"  y="80" width="190" height="96" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="125" y="112" text-anchor="middle" font-size="17" fill="#64748b">SQLite</text>
  <text x="125" y="148" text-anchor="middle" font-size="24" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">is_like = 1</text>

  <rect x="280" y="80" width="200" height="96" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="380" y="112" text-anchor="middle" font-size="17" fill="#ea580c">PostModel</text>
  <text x="380" y="148" text-anchor="middle" font-size="24" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">isLike: 1</text>

  <rect x="540" y="80" width="210" height="96" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="645" y="112" text-anchor="middle" font-size="17" fill="#16a34a">PostEntity</text>
  <text x="645" y="148" text-anchor="middle" font-size="22" fill="#0f172a" font-family="ui-monospace, Menlo, monospace">isLike: true</text>

  <rect x="810" y="80" width="160" height="96" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="890" y="112" text-anchor="middle" font-size="17" fill="#64748b">Giao diện</text>
  <text x="890" y="152" text-anchor="middle" font-size="30">❤️</text>

  <!-- mũi tên -->
  <line x1="220" y1="128" x2="272" y2="128" stroke="#64748b" stroke-width="2.5" marker-end="url(#m)"/>
  <line x1="480" y1="128" x2="532" y2="128" stroke="#64748b" stroke-width="2.5" marker-end="url(#m)"/>
  <line x1="750" y1="128" x2="802" y2="128" stroke="#64748b" stroke-width="2.5" marker-end="url(#m)"/>

  <!-- nhãn tầng -->
  <text x="380" y="202" text-anchor="middle" font-size="14" fill="#ea580c">tầng data</text>
  <text x="645" y="202" text-anchor="middle" font-size="14" fill="#16a34a">tầng domain</text>

  <!-- chú thích -->
  <text x="30" y="252" font-size="16" fill="#0f172a" font-weight="600">SQLite không có kiểu true / false — nó chỉ lưu số 1 và 0.</text>
  <text x="30" y="278" font-size="15" fill="#64748b">PostModel nhốt hạn chế đó lại trong tầng data, để phần còn lại của app không phải biết.</text>
</svg>
