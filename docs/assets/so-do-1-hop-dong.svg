<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- hàng trên: UI → Provider → hợp đồng -->
  <rect x="40"  y="70" width="200" height="74" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="140" y="114" text-anchor="middle" font-size="20" fill="#0f172a">HomePage</text>

  <rect x="310" y="70" width="220" height="74" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="420" y="114" text-anchor="middle" font-size="20" fill="#0f172a">PostProvider</text>

  <rect x="600" y="70" width="290" height="74" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="745" y="106" text-anchor="middle" font-size="20" fill="#0f172a">IPostRepository</text>
  <text x="745" y="130" text-anchor="middle" font-size="14" fill="#dc2626">hợp đồng — chỉ khai báo</text>

  <!-- mũi tên ngang -->
  <line x1="240" y1="107" x2="302" y2="107" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="530" y1="107" x2="592" y2="107" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- implementation cắm ngược lên -->
  <rect x="590" y="230" width="310" height="74" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="745" y="274" text-anchor="middle" font-size="19" fill="#0f172a">InMemoryPostRepository</text>

  <line x1="745" y1="228" x2="745" y2="150" stroke="#dc2626" stroke-width="3" marker-end="url(#b)"/>
  <text x="765" y="196" font-size="15" fill="#dc2626" font-weight="600">cắm vào hợp đồng</text>

  <!-- chú thích -->
  <text x="40" y="300" font-size="15" fill="#64748b">Provider không gọi xuống class cụ thể —</text>
  <text x="40" y="322" font-size="15" fill="#64748b">class cụ thể tự cắm ngược lên hợp đồng.</text>
</svg>
